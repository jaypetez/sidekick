services:
  sidekick:
    build: .
    image: sidekick:latest
    container_name: sidekick
    env_file: .env
    volumes:
      # Persists SQLite DB, Chronary IDs (~/.config/sidekick/config.json),
      # custom reminders JSON, and personality config across container
      # restarts. Adjust the host path as needed.
      - ${SIDEKICK_HOST_CONFIG:-./data/sidekick}:/home/app/.config/sidekick
    ports:
      # Publishes the in-process web UI on the host's loopback. The container
      # must bind on 0.0.0.0 internally for this to reach it — set
      # SIDEKICK_WEB_HOST=0.0.0.0 in .env (example 01 does this for you).
      # Stays on 127.0.0.1 on the host so the dashboard isn't internet-exposed.
      - "127.0.0.1:${SIDEKICK_WEB_PORT:-8080}:${SIDEKICK_WEB_PORT:-8080}"
    restart: unless-stopped
    # If LLM_PROVIDER=ollama, the bot needs to reach the ollama service.
    # Override OLLAMA_BASE_URL in .env to http://ollama:11434 in that case.
    # `ollama` only exists under the `ollama` profile, so the dependency must
    # be optional: newer Compose releases reject a plain `depends_on` on a
    # service that isn't in the active profiles ("depends on undefined
    # service"). `required: false` (Compose >= 2.20) starts ollama first when
    # its profile is on and ignores it otherwise.
    depends_on:
      ollama:
        condition: service_started
        required: false

  ollama:
    image: ollama/ollama:latest
    container_name: sidekick-ollama
    profiles: ["ollama"]
    ports:
      # Bind to host loopback only — prevents the Ollama API from being
      # exposed on the LAN. Use `docker exec sidekick-ollama ...` or
      # other containers on the compose network to reach it remotely.
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    # NVIDIA GPU passthrough lives in docker-compose.gpu.yml — opt in by adding
    # `-f docker-compose.gpu.yml` to your compose command. Keeping it in an
    # override file means this base config works on every machine.

volumes:
  ollama_data:
