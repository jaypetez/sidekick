<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" role="img" aria-label="Sidekick — a friendly AI assistant logo">
  <title>Sidekick</title>
  <desc>A friendly AI assistant character with a glowing antenna, screen face, and floating particles, with the wordmark SIDEKICK underneath.</desc>

  <!--
    Motion is plain CSS (not SMIL) so it can honour prefers-reduced-motion,
    and the wordmark switches to a light fill under prefers-color-scheme:
    dark. The default violet reads on both light and dark backgrounds, which
    matters for the dashboard header: it is always dark, whatever the
    viewer's colour scheme.
    This file is duplicated at src/sidekick/web/static/sidekick-logo.svg;
    tests/test_logo_assets.py keeps the two copies identical.
  -->
  <style>
    .wordmark { fill: #8B5CF6; }
    @media (prefers-color-scheme: dark) {
      .wordmark { fill: #C4B5FD; }
    }

    .halo, .tip-glow, .tip-core, .eye, .shimmer, .hand, .particle {
      transform-box: fill-box;
      transform-origin: center;
    }
    .halo      { animation: halo 4s ease-in-out infinite; }
    .bob       { animation: bob 4s ease-in-out infinite; }
    .tip-glow  { animation: tip-glow 1.6s ease-in-out infinite; }
    .tip-core  { animation: tip-core 1.6s ease-in-out infinite, tip-color 3.2s linear infinite; }
    .shimmer   { opacity: 0; animation: shimmer 4s ease-in-out infinite; }
    .eye       { animation: blink 6s linear infinite; }
    .hand-l    { animation: hand-up 3s ease-in-out infinite; }
    .hand-r    { animation: hand-down 3s ease-in-out infinite; }
    .particle  { opacity: 0.8; animation: drift var(--dur) ease-in-out var(--delay, 0s) infinite; }

    @keyframes halo      { 0%, 100% { transform: scale(1); opacity: 0.85; } 50% { transform: scale(1.18); opacity: 1; } }
    @keyframes bob       { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    @keyframes tip-glow  { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.6); } }
    @keyframes tip-core  { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.5); } }
    @keyframes tip-color { 0%, 100% { fill: #FBBF24; } 50% { fill: #F472B6; } }
    @keyframes shimmer   { 0%, 100% { opacity: 0; } 50% { opacity: 0.06; } }
    @keyframes blink     { 0%, 40%, 44%, 92%, 100% { transform: scaleY(1); } 42%, 95% { transform: scaleY(0.07); } }
    @keyframes hand-up   { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    @keyframes hand-down { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(10px); } }
    @keyframes drift     { 0%, 100% { transform: translateY(0); opacity: 0; } 50% { transform: translateY(var(--dy)); opacity: 1; } }

    @media (prefers-reduced-motion: reduce) {
      .halo, .bob, .tip-glow, .tip-core, .shimmer, .eye, .hand-l, .hand-r, .particle {
        animation: none;
      }
    }
  </style>

  <defs>
    <!-- Body gradient -->
    <linearGradient id="body" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#4338CA"/>
    </linearGradient>

    <!-- Screen gradient -->
    <linearGradient id="screen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#0B1029"/>
    </linearGradient>

    <!-- Soft halo behind the character -->
    <radialGradient id="halo">
      <stop offset="0%"  stop-color="#A78BFA" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#A78BFA" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>

    <!-- Antenna tip glow -->
    <radialGradient id="tipGlow">
      <stop offset="0%"  stop-color="#FBBF24" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#F472B6" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#F472B6" stop-opacity="0"/>
    </radialGradient>

    <!-- Soft drop-shadow for the body, GitHub-safe (filter primitives are allowed) -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="6"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.25"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Pulsing halo (lives behind everything, doesn't bob with the character) -->
  <circle class="halo" cx="300" cy="190" r="140" fill="url(#halo)"/>

  <!-- ===== Character group — gentle floating bob ===== -->
  <g filter="url(#softShadow)">
    <g class="bob">
      <!-- Antenna stem -->
      <line x1="300" y1="118" x2="300" y2="78" stroke="#8B5CF6" stroke-width="5" stroke-linecap="round"/>

      <!-- Antenna tip glow halo -->
      <circle class="tip-glow" cx="300" cy="70" r="16" fill="url(#tipGlow)"/>
      <!-- Antenna tip core -->
      <circle class="tip-core" cx="300" cy="70" r="5" fill="#FBBF24"/>

      <!-- Body — rounded "AI buddy" silhouette -->
      <rect x="206" y="125" width="188" height="148" rx="78" ry="58" fill="url(#body)"/>

      <!-- Subtle body highlight -->
      <ellipse cx="260" cy="148" rx="40" ry="10" fill="#FFFFFF" opacity="0.18"/>

      <!-- Screen face -->
      <rect x="232" y="156" width="136" height="92" rx="22" ry="22" fill="url(#screen)"/>
      <!-- Screen scanline shimmer -->
      <rect class="shimmer" x="232" y="156" width="136" height="92" rx="22" ry="22" fill="#22D3EE"/>

      <!-- Eyes — cyan LCD glow with periodic blink -->
      <g>
        <ellipse class="eye" cx="275" cy="200" rx="10" ry="14" fill="#22D3EE"/>
        <ellipse class="eye" cx="325" cy="200" rx="10" ry="14" fill="#22D3EE"/>
        <!-- Eye highlights (catchlight) -->
        <circle cx="278" cy="196" r="2.5" fill="#FFFFFF" opacity="0.9"/>
        <circle cx="328" cy="196" r="2.5" fill="#FFFFFF" opacity="0.9"/>
      </g>

      <!-- Smile — gentle, content -->
      <path d="M283 225 Q300 238 317 225"
            stroke="#22D3EE" stroke-width="3" stroke-linecap="round" fill="none"/>

      <!-- Floating "hands" — small orbs the character holds at its sides -->
      <circle class="hand hand-l" cx="178" cy="205" r="14" fill="url(#body)"/>
      <circle class="hand hand-r" cx="422" cy="205" r="14" fill="url(#body)"/>
    </g>
  </g>

  <!-- ===== Ambient sparkle particles around the character ===== -->
  <g>
    <!-- Top-left -->
    <circle class="particle" style="--dur:4.5s; --dy:-30px" cx="140" cy="120" r="3" fill="#A78BFA"/>
    <!-- Top-right -->
    <circle class="particle" style="--dur:3.8s; --dy:-35px; --delay:0.4s" cx="465" cy="135" r="3" fill="#22D3EE"/>
    <!-- Mid-left -->
    <circle class="particle" style="--dur:5s; --dy:-20px; --delay:1.2s" cx="115" cy="200" r="2.5" fill="#F472B6"/>
    <!-- Mid-right -->
    <circle class="particle" style="--dur:4.2s; --dy:-20px; --delay:0.8s" cx="495" cy="215" r="2.5" fill="#FBBF24"/>
    <!-- Lower-left -->
    <circle class="particle" style="--dur:3.6s; --dy:-20px; --delay:1.8s" cx="170" cy="275" r="2" fill="#A78BFA"/>
    <!-- Lower-right -->
    <circle class="particle" style="--dur:4.8s; --dy:-22px; --delay:2.1s" cx="448" cy="280" r="2" fill="#22D3EE"/>
  </g>

  <!-- ===== Wordmark ===== -->
  <text class="wordmark" x="300" y="335" text-anchor="middle"
        font-family="'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="22" font-weight="800" letter-spacing="10">SIDEKICK</text>
</svg>
